<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Quadrant Failure Map</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      background: #12131a;
      color: #dde;
      font-family: 'Courier New', monospace;
    }
    h1 { margin: 0 0 12px; font-size: 20px; color: #e05a6f; letter-spacing: 1px; }
    #controls {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 14px; flex-wrap: wrap;
    }
    button {
      background: #e05a6f; color: #fff; border: none;
      padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;
      transition: background 0.15s;
    }
    button:hover    { background: #c04050; }
    button.teal     { background: #2a9d8f; }
    button.teal:hover { background: #1f7a6f; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #patternName {
      font-size: 12px; color: #4db6ac; font-style: italic;
    }
    #status { font-size: 12px; color: #888; }
    .legend-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; font-size: 11px; color: #999;
    }
    .legend-bar {
      width: 180px; height: 14px;
      background: linear-gradient(to right, #e8f4fd, #4a90d9, #ffffff, #e05a6f, #a00020);
      border: 1px solid #333; border-radius: 2px;
    }
    #outer { overflow: auto; max-width: 100%; }
    #container { position: relative; display: inline-block; }
    canvas { display: block; cursor: crosshair; }
    #tooltip {
      position: absolute;
      background: rgba(10,10,20,0.93);
      color: #dde;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      display: none;
      white-space: pre;
      border: 1px solid #444;
      line-height: 1.65;
      z-index: 10;
    }
  </style>
</head>
<body>
  <h1>Quadrant Failure Map</h1>

  <div id="controls">
    <button onclick="loadData()">새로고침</button>
    <button class="teal" id="demoBtn" onclick="generateDemo()">더미 데이터 생성</button>
    <span id="patternName"></span>
    <label style="font-size:12px; color:#888; margin-left:4px;">
      <input type="checkbox" id="autoRefresh" onchange="toggleAuto()" checked>
      자동 새로고침 (5s)
    </label>
    <span id="status">로딩 중...</span>
  </div>

  <div class="legend-row">
    <span>낮음</span>
    <div class="legend-bar"></div>
    <span>높음</span>
    <span style="margin-left:16px; color:#444">데이터 없음: 빈 배경</span>
  </div>
  <div style="font-size:11px; color:#555; margin-bottom:12px;">
    셀 내 배치 — TL:sheet1 &nbsp;TR:sheet2 &nbsp;BL:sheet3 &nbsp;BR:sheet4
  </div>

  <div id="outer">
    <div id="container">
      <canvas id="grid"></canvas>
      <div id="tooltip"></div>
    </div>
  </div>

  <script>
    // ── layout constants ────────────────────────────────────────────────────────
    const CELL  = 16;          // px per die cell
    const QUAD  = CELL / 2;   // px per sub-quadrant
    const GRID  = 50;          // 50 × 50 grid
    const PAD_L = 44;
    const PAD_B = 30;
    const PAD_T = 8;
    const PAD_R = 8;
    const W = PAD_L + GRID * CELL + PAD_R;
    const H = PAD_T + GRID * CELL + PAD_B;

    // ── wafer geometry ──────────────────────────────────────────────────────────
    const CX = 25.5, CY = 25.5, R = 22;   // wafer center and radius

    // ── runtime state ───────────────────────────────────────────────────────────
    let dataMap = {};
    let maxVal  = 1;
    let autoId  = null;

    // ── color scale (blue → white → red) ───────────────────────────────────────
    function getColor(val, max) {
      if (max === 0 || val === 0) return '#e8f4fd';
      const t = Math.min(val / max, 1);
      let r, g, b;
      if (t < 0.5) {
        const s = t * 2;
        r = Math.round(0x4a + s * (255 - 0x4a));
        g = Math.round(0x90 + s * (255 - 0x90));
        b = Math.round(0xd9 + s * (255 - 0xd9));
      } else {
        const s = (t - 0.5) * 2;
        r = Math.round(255 + s * (0xa0 - 255));
        g = Math.round(255 + s * (0x00 - 255));
        b = Math.round(255 + s * (0x20 - 255));
      }
      return `rgb(${r},${g},${b})`;
    }

    // ── rendering ───────────────────────────────────────────────────────────────
    function render() {
      const canvas = document.getElementById('grid');
      canvas.width  = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      // dark background
      ctx.fillStyle = '#1a1b26';
      ctx.fillRect(0, 0, W, H);

      // draw each die cell
      for (const key of Object.keys(dataMap)) {
        const item = dataMap[key];
        if (item.x < 1 || item.x > GRID || item.y < 1 || item.y > GRID) continue;

        // Cartesian → canvas (y flipped)
        const cx = PAD_L + (item.x - 1) * CELL;
        const cy = PAD_T + (GRID - item.y) * CELL;

        // ① Fill four sub-quadrants with NO gap between them
        ctx.fillStyle = getColor(item.sheet1, maxVal);
        ctx.fillRect(cx,        cy,        QUAD, QUAD);

        ctx.fillStyle = getColor(item.sheet2, maxVal);
        ctx.fillRect(cx + QUAD, cy,        QUAD, QUAD);

        ctx.fillStyle = getColor(item.sheet3, maxVal);
        ctx.fillRect(cx,        cy + QUAD, QUAD, QUAD);

        ctx.fillStyle = getColor(item.sheet4, maxVal);
        ctx.fillRect(cx + QUAD, cy + QUAD, QUAD, QUAD);

        // ② Black border around the whole cell only (no internal dividers)
        ctx.strokeStyle = '#000';
        ctx.lineWidth   = 1;
        ctx.strokeRect(cx + 0.5, cy + 0.5, CELL - 1, CELL - 1);
      }

      // axis tick labels — X (bottom)
      ctx.fillStyle    = '#666';
      ctx.font         = '9px monospace';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'top';
      for (let x = 1; x <= GRID; x += 5) {
        ctx.fillText(x, PAD_L + (x - 1) * CELL + CELL / 2, PAD_T + GRID * CELL + 4);
      }

      // axis tick labels — Y (left, bottom-to-top in Cartesian)
      ctx.textAlign    = 'right';
      ctx.textBaseline = 'middle';
      for (let y = 1; y <= GRID; y += 5) {
        ctx.fillText(y, PAD_L - 4, PAD_T + (GRID - y) * CELL + CELL / 2);
      }

      // axis name labels
      ctx.fillStyle = '#555';
      ctx.font      = '10px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('X', PAD_L + GRID * CELL / 2, H - 1);
      ctx.save();
      ctx.translate(10, PAD_T + GRID * CELL / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textBaseline = 'top';
      ctx.fillText('Y', 0, 0);
      ctx.restore();
    }

    // ── data loading ────────────────────────────────────────────────────────────
    async function loadData() {
      try {
        const resp  = await fetch('/api/data');
        const items = await resp.json();
        dataMap = {};
        maxVal  = 0;
        for (const item of items) {
          dataMap[`${item.x},${item.y}`] = item;
          const m = Math.max(item.sheet1, item.sheet2, item.sheet3, item.sheet4);
          if (m > maxVal) maxVal = m;
        }
        if (maxVal === 0) maxVal = 1;
        document.getElementById('status').textContent =
          `${items.length}개 항목 | 최대 실패: ${maxVal.toLocaleString()}`;
        render();
      } catch (e) {
        document.getElementById('status').textContent = '오류: ' + e.message;
      }
    }

    // ── auto-refresh ─────────────────────────────────────────────────────────────
    function toggleAuto() {
      if (document.getElementById('autoRefresh').checked) {
        autoId = setInterval(loadData, 5000);
      } else {
        clearInterval(autoId);
        autoId = null;
      }
    }

    // ── tooltip ──────────────────────────────────────────────────────────────────
    const canvas  = document.getElementById('grid');
    const tooltip = document.getElementById('tooltip');

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx   = (e.clientX - rect.left) * (canvas.width  / rect.width);
      const my   = (e.clientY - rect.top)  * (canvas.height / rect.height);
      const gx   = Math.floor((mx - PAD_L) / CELL) + 1;
      const gy   = GRID - Math.floor((my - PAD_T) / CELL);
      if (gx < 1 || gx > GRID || gy < 1 || gy > GRID) {
        tooltip.style.display = 'none'; return;
      }
      const item = dataMap[`${gx},${gy}`];
      if (!item) { tooltip.style.display = 'none'; return; }
      const total = item.sheet1 + item.sheet2 + item.sheet3 + item.sheet4;
      tooltip.textContent =
        `위치 (${gx}, ${gy})\n` +
        `TL sheet1 : ${item.sheet1.toLocaleString()}\n` +
        `TR sheet2 : ${item.sheet2.toLocaleString()}\n` +
        `BL sheet3 : ${item.sheet3.toLocaleString()}\n` +
        `BR sheet4 : ${item.sheet4.toLocaleString()}\n` +
        `합계      : ${total.toLocaleString()}`;
      tooltip.style.left    = (e.clientX - rect.left + 14) + 'px';
      tooltip.style.top     = (e.clientY - rect.top  + 14) + 'px';
      tooltip.style.display = 'block';
    });
    canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

    // ═══════════════════════════════════════════════════════════════════════════
    // DEMO DATA — wafer-map failure patterns
    //
    // Design rule: every pattern fn(x,y) → [s1,s2,s3,s4]  (each 0..1)
    //
    //   base(x,y)  drives 70–80 % of the signal → spatial coherence
    //   δ1…δ4     per-sheet modulation ≤ ±0.25  → subtle sub-quad variation
    //
    // At any "hot" cell all four sheets land in a similar colour range;
    // the tiny deltas show which quadrant of the die is under more stress.
    // ═══════════════════════════════════════════════════════════════════════════

    // ── shared math helpers ──────────────────────────────────────────────────────
    function gauss(x, y, px, py, sigma) {
      return Math.exp(-((x - px) ** 2 + (y - py) ** 2) / (2 * sigma * sigma));
    }
    function ringVal(x, y, targetR, sigma) {
      const r = Math.sqrt((x - CX) ** 2 + (y - CY) ** 2);
      return Math.exp(-((r - targetR) ** 2) / (2 * sigma * sigma));
    }
    function edgeFrac(x, y) {
      return Math.sqrt((x - CX) ** 2 + (y - CY) ** 2) / R;
    }
    function clamp(v) { return Math.min(Math.max(v, 0), 1); }

    // Spread [s] into four slightly different values using four small deltas.
    // delta array [d1,d2,d3,d4] each in (-1,1); maxShift caps absolute change.
    function spread(base, deltas, maxShift) {
      return deltas.map(d => clamp(base + d * maxShift));
    }

    // ── Pattern 0: twin hot-spots (TL + TR quadrant of wafer) ───────────────────
    // base  = blend of two large Gaussian peaks + gentle ring halo
    // delta = each sheet slightly favours one peak or the ring
    function patternClassic(x, y) {
      const tl   = gauss(x, y, 13, 38, 10);
      const tr   = gauss(x, y, 38, 38, 10);
      const halo = ringVal(x, y, 18, 3.5) * 0.5;
      const base = clamp(tl * 0.65 + tr * 0.60 + halo);
      // δ: +TL peak / +TR peak / +ring / +both peaks sharp
      return spread(base,
        [ gauss(x,y,12,39,5) - 0.5*gauss(x,y,38,38,5),
          gauss(x,y,39,39,5) - 0.5*gauss(x,y,13,38,5),
          ringVal(x,y,17,2) - gauss(x,y,26,26,5)*0.4,
          gauss(x,y,13,38,4)*0.6 + gauss(x,y,38,38,4)*0.6 - 0.5 ],
        0.22);
    }

    // ── Pattern 1: crossed diagonal scratches (\  and /) ────────────────────────
    // base  = max of both diagonals (wherever either line is, cell is hot)
    // delta = each sheet tilts toward one scratch vs the other
    function patternScratch(x, y) {
      const sig = 2.0;
      const d1  = Math.exp(-((y - x)        ** 2) / (2 * sig * sig));  // '\'
      const d2  = Math.exp(-((y - (51 - x)) ** 2) / (2 * sig * sig));  // '/'
      const base = clamp(Math.max(d1, d2) * 0.88 + edgeFrac(x, y) * 0.06);
      return spread(base,
        [ d1 - d2,            //  '\' bias
          d2 - d1,            //  '/' bias
          (d1 + d2) * 0.5 - 0.5,  // both present → push up at intersection
          Math.abs(d1 - d2) * (-1) ],  // pull down at intersection (purely on one line)
        0.22);
    }

    // ── Pattern 2: concentric rings / bulls-eye ──────────────────────────────────
    // base  = same cosine ring wave for every sheet (same phase → same ring bands)
    // delta = each sheet uses a very slightly different ring period
    function patternBullseye(x, y) {
      const rr  = Math.sqrt((x - CX) ** 2 + (y - CY) ** 2);
      const env = clamp(rr / 5);        // fades to zero at centre
      const T   = 7.5;
      const wave = p => ((Math.cos(rr * Math.PI / p) + 1) / 2) * env;
      const base = wave(T);
      return spread(base,
        [ wave(T * 0.88) - base,   // tighter rings
          wave(T * 1.12) - base,   // wider rings
          wave(T * 0.94) - base,
          wave(T * 1.06) - base ],
        0.90);   // multiplier stays in effect because deltas are already small
    }

    // ── Pattern 3: directional process gradient ──────────────────────────────────
    // base  = single strong S→N gradient across the wafer
    // delta = each sheet tilts the gradient a few degrees in a different direction
    function patternGradient(x, y) {
      const nx  = (x - CX) / R;                // −1 (left)  … +1 (right)
      const ny  = (y - CY) / R;                // −1 (bottom) … +1 (top)
      const vig = clamp(1 - edgeFrac(x, y) * 0.25);
      const base = clamp(((ny + 1) / 2) * vig);  // 0 at bottom, 1 at top
      const t   = 0.20;                           // max tilt per sheet
      return [
        clamp(base + nx *  t * vig),   // leans right (NE corner hottest)
        clamp(base + nx * -t * vig),   // leans left  (NW corner hottest)
        clamp(base + nx *  t * 0.5 * vig + ny *  t * 0.3 * vig),
        clamp(base + nx * -t * 0.5 * vig + ny *  t * 0.3 * vig),
      ];
    }

    // ── Pattern 4: edge sector defect ───────────────────────────────────────────
    // base  = moderate edge elevation (all sheets warm at rim)
    // delta = each sheet gets an additional boost in one compass-direction sector
    //         → within each rim cell all quads are warm; the "winning" sheet varies
    function patternSector(x, y) {
      const ef    = Math.pow(edgeFrac(x, y), 1.4);
      const base  = ef * 0.58;          // all sheets elevated at rim
      const angle = Math.atan2(y - CY, x - CX);
      function sectorBoost(peakAngle) {
        const d = Math.abs(((angle - peakAngle + 3 * Math.PI) % (2 * Math.PI)) - Math.PI);
        return Math.cos(Math.min(d, Math.PI / 2)) ** 2 * ef * 0.42;
      }
      return [
        clamp(base + sectorBoost(0)),            // E  sector → sheet1 leads
        clamp(base + sectorBoost(Math.PI / 2)),  // N  sector → sheet2 leads
        clamp(base + sectorBoost(Math.PI)),      // W  sector → sheet3 leads
        clamp(base + sectorBoost(-Math.PI / 2)), // S  sector → sheet4 leads
      ];
    }

    // ── Pattern 5: scattered micro-clusters ──────────────────────────────────────
    // base  = sum of ALL cluster Gaussians (every sheet sees every cluster)
    // delta = each sheet subtly emphasises a different pair of clusters
    function patternClusters(x, y) {
      const ALL = [[10,40],[28,44],[42,38],[35,14],[6,22],[44,20],[18,10],[22,28]];
      const base = clamp(ALL.reduce((s, [px, py]) =>
        s + gauss(x, y, px, py, 5.0) * 0.42, 0));
      // small per-sheet accent (single tighter Gaussian at two clusters each)
      const accent = (p1, p2) =>
        gauss(x, y, p1[0], p1[1], 3.2) * 0.15 +
        gauss(x, y, p2[0], p2[1], 3.2) * 0.12;
      return [
        clamp(base + accent(ALL[0], ALL[4])),
        clamp(base + accent(ALL[1], ALL[3])),
        clamp(base + accent(ALL[2], ALL[5])),
        clamp(base + accent(ALL[6], ALL[7])),
      ];
    }

    // ── Pattern 6: centre disk + edge ring ───────────────────────────────────────
    // base  = equal blend of inner Gaussian blob and outer rim ring
    //         → both regions are consistently warm in every sheet
    // delta = each sheet has slightly different inner:outer mixing ratio
    function patternEdgeCenter(x, y) {
      const rr    = Math.sqrt((x - CX) ** 2 + (y - CY) ** 2);
      const inner = Math.exp(-(rr ** 2) / (2 * 7 * 7));
      const outer = ringVal(x, y, R * 0.84, 2.5);
      const base  = clamp(inner * 0.50 + outer * 0.50);   // equal base
      const mix   = 0.22;   // max shift
      return [
        clamp(base + (inner - outer) *  mix),   // inner-heavy
        clamp(base + (inner - outer) * -mix),   // outer-heavy
        clamp(base + (inner - outer) *  mix * 0.4),
        clamp(base + (inner - outer) * -mix * 0.4),
      ];
    }

    // ── pattern registry ─────────────────────────────────────────────────────────
    const PATTERNS = [
      { name: '트윈 핫스팟 (TL+TR clusters + halo)', fn: patternClassic    },
      { name: '대각선 스크래치 (crossed \\ / lines)', fn: patternScratch    },
      { name: '동심원 불스아이 (concentric rings)',   fn: patternBullseye   },
      { name: '공정 그래디언트 (S→N drift)',          fn: patternGradient   },
      { name: '방위각 섹터 결함 (N/S/E/W edge lobe)', fn: patternSector     },
      { name: '산발성 마이크로 클러스터',              fn: patternClusters   },
      { name: '중심·엣지 분리 결함 (disk + rim ring)',fn: patternEdgeCenter },
    ];

    // ── generate & post demo data ────────────────────────────────────────────────
    async function generateDemo() {
      const btn = document.getElementById('demoBtn');
      btn.disabled = true;

      // pick a random pattern
      const idx  = Math.floor(Math.random() * PATTERNS.length);
      const pat  = PATTERNS[idx];
      document.getElementById('patternName').textContent = `[ ${pat.name} ]`;
      document.getElementById('status').textContent = '더미 데이터 생성 중...';

      const MAX   = 9_800_000;
      const items = [];

      for (let x = 1; x <= GRID; x++) {
        for (let y = 1; y <= GRID; y++) {
          if ((x - CX) ** 2 + (y - CY) ** 2 > R * R) continue;  // wafer mask
          const [s1, s2, s3, s4] = pat.fn(x, y);
          items.push({
            x, y,
            sheet1: Math.round(MAX * s1),
            sheet2: Math.round(MAX * s2),
            sheet3: Math.round(MAX * s3),
            sheet4: Math.round(MAX * s4),
          });
        }
      }

      try {
        const resp = await fetch('/api/data', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(items),
        });
        if (!resp.ok) throw new Error('서버 응답 오류 ' + resp.status);
        await loadData();
      } catch (e) {
        document.getElementById('status').textContent = '오류: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    // ── init ────────────────────────────────────────────────────────────────────
    loadData();
    autoId = setInterval(loadData, 5000);
  </script>
</body>
</html>
