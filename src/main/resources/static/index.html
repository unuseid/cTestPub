<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Quadrant Failure Map</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      background: #12131a;
      color: #dde;
      font-family: 'Courier New', monospace;
    }
    h1 { margin: 0 0 12px; font-size: 20px; color: #e05a6f; letter-spacing: 1px; }
    #controls {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 14px; flex-wrap: wrap;
    }
    button {
      background: #e05a6f; color: #fff; border: none;
      padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;
      transition: background 0.15s;
    }
    button:hover    { background: #c04050; }
    button.teal     { background: #2a9d8f; }
    button.teal:hover { background: #1f7a6f; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #patternName {
      font-size: 12px; color: #4db6ac; font-style: italic;
    }
    #status { font-size: 12px; color: #888; }
    .legend-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; font-size: 11px; color: #999;
    }
    .legend-bar {
      width: 180px; height: 14px;
      background: linear-gradient(to right, #ffffff 0%, #3258c8 50%, #ffc814 75%, #b4001a 100%);
      border: 1px solid #333; border-radius: 2px;
    }
    #outer { overflow: auto; max-width: 100%; }
    #container { position: relative; display: inline-block; }
    canvas { display: block; cursor: crosshair; }
    #tooltip {
      position: absolute;
      background: rgba(10,10,20,0.93);
      color: #dde;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      display: none;
      white-space: pre;
      border: 1px solid #444;
      line-height: 1.65;
      z-index: 10;
    }
  </style>
</head>
<body>
  <h1>Quadrant Failure Map</h1>

  <div id="controls">
    <button onclick="loadData()">새로고침</button>
    <button class="teal" id="demoBtn" onclick="generateDemo()">더미 데이터 생성</button>
    <span id="patternName"></span>
    <label style="font-size:12px; color:#888; margin-left:4px;">
      <input type="checkbox" id="autoRefresh" onchange="toggleAuto()" checked>
      자동 새로고침 (5s)
    </label>
    <span id="status">로딩 중...</span>
  </div>

  <div class="legend-row">
    <span>낮음</span>
    <div class="legend-bar"></div>
    <span>높음</span>
    <span style="margin-left:16px; color:#444">데이터 없음: 빈 배경</span>
  </div>
  <div style="font-size:11px; color:#555; margin-bottom:12px;">
    셀 내 배치 — TL:sheet1 &nbsp;TR:sheet2 &nbsp;BL:sheet3 &nbsp;BR:sheet4
  </div>

  <div id="outer">
    <div id="container">
      <canvas id="grid"></canvas>
      <div id="tooltip"></div>
    </div>
  </div>

  <script>
    // ── layout constants ────────────────────────────────────────────────────────
    const CELL  = 16;          // px per die cell
    const QUAD  = CELL / 2;   // px per sub-quadrant
    const GRID  = 50;          // 50 × 50 grid
    const PAD_L = 44;
    const PAD_B = 30;
    const PAD_T = 8;
    const PAD_R = 8;
    const W = PAD_L + GRID * CELL + PAD_R;
    const H = PAD_T + GRID * CELL + PAD_B;

    // ── wafer geometry ──────────────────────────────────────────────────────────
    const CX = 25.5, CY = 25.5, R = 22;   // wafer center and radius

    // ── runtime state ───────────────────────────────────────────────────────────
    let dataMap = {};
    let maxVal  = 1;
    let autoId  = null;

    // ── color scale: white → blue → yellow → red ────────────────────────────────
    //
    // Stop positions are NON-UNIFORM so white occupies 0–50 % of the value range.
    // That means cells with < 50 % of the peak failure count stay white/light,
    // and only the real defect core rises through blue → yellow → red.
    //
    //   t=0.00  white  (255,255,255)
    //   t=0.50  blue   ( 50, 90,200)   ← wide white zone below this
    //   t=0.75  yellow (255,200, 20)
    //   t=1.00  red    (180,  0, 25)
    //
    // No gamma correction — the stop placement already handles perceptual spread.
    // val===0 (cell not in dataset) returns null → canvas dark background shows.
    const COLOR_STOPS = [
      { t: 0.00, r: 255, g: 255, b: 255 },
      { t: 0.50, r:  50, g:  90, b: 200 },
      { t: 0.75, r: 255, g: 200, b:  20 },
      { t: 1.00, r: 180, g:   0, b:  25 },
    ];

    function getColor(val, max) {
      if (max === 0 || val === 0) return null;
      const t  = Math.min(val / max, 1);
      let lo = COLOR_STOPS[0], hi = COLOR_STOPS[COLOR_STOPS.length - 1];
      for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
        if (t <= COLOR_STOPS[i + 1].t) { lo = COLOR_STOPS[i]; hi = COLOR_STOPS[i + 1]; break; }
      }
      const f = hi.t === lo.t ? 0 : (t - lo.t) / (hi.t - lo.t);
      return `rgb(${Math.round(lo.r+f*(hi.r-lo.r))},${Math.round(lo.g+f*(hi.g-lo.g))},${Math.round(lo.b+f*(hi.b-lo.b))})`;
    }

    // ── rendering ───────────────────────────────────────────────────────────────
    function render() {
      const canvas = document.getElementById('grid');
      canvas.width  = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      // dark background
      ctx.fillStyle = '#1a1b26';
      ctx.fillRect(0, 0, W, H);

      // draw each die cell
      for (const key of Object.keys(dataMap)) {
        const item = dataMap[key];
        if (item.x < 1 || item.x > GRID || item.y < 1 || item.y > GRID) continue;

        // Cartesian → canvas (y flipped)
        const cx = PAD_L + (item.x - 1) * CELL;
        const cy = PAD_T + (GRID - item.y) * CELL;

        // ① Fill whole cell white first so any zero-value sub-quad shows white
        //    (not the dark canvas background). Non-zero quads then overlay on top.
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(cx, cy, CELL, CELL);

        const c1 = getColor(item.sheet1, maxVal);
        const c2 = getColor(item.sheet2, maxVal);
        const c3 = getColor(item.sheet3, maxVal);
        const c4 = getColor(item.sheet4, maxVal);
        if (c1) { ctx.fillStyle = c1; ctx.fillRect(cx,        cy,        QUAD, QUAD); }
        if (c2) { ctx.fillStyle = c2; ctx.fillRect(cx + QUAD, cy,        QUAD, QUAD); }
        if (c3) { ctx.fillStyle = c3; ctx.fillRect(cx,        cy + QUAD, QUAD, QUAD); }
        if (c4) { ctx.fillStyle = c4; ctx.fillRect(cx + QUAD, cy + QUAD, QUAD, QUAD); }

        // ② Black border around the whole cell only (no internal dividers)
        ctx.strokeStyle = '#000';
        ctx.lineWidth   = 1;
        ctx.strokeRect(cx + 0.5, cy + 0.5, CELL - 1, CELL - 1);
      }

      // axis tick labels — X (bottom)
      ctx.fillStyle    = '#666';
      ctx.font         = '9px monospace';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'top';
      for (let x = 1; x <= GRID; x += 5) {
        ctx.fillText(x, PAD_L + (x - 1) * CELL + CELL / 2, PAD_T + GRID * CELL + 4);
      }

      // axis tick labels — Y (left, bottom-to-top in Cartesian)
      ctx.textAlign    = 'right';
      ctx.textBaseline = 'middle';
      for (let y = 1; y <= GRID; y += 5) {
        ctx.fillText(y, PAD_L - 4, PAD_T + (GRID - y) * CELL + CELL / 2);
      }

      // axis name labels
      ctx.fillStyle = '#555';
      ctx.font      = '10px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('X', PAD_L + GRID * CELL / 2, H - 1);
      ctx.save();
      ctx.translate(10, PAD_T + GRID * CELL / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textBaseline = 'top';
      ctx.fillText('Y', 0, 0);
      ctx.restore();
    }

    // ── data loading ────────────────────────────────────────────────────────────
    async function loadData() {
      try {
        const resp  = await fetch('/api/data');
        const items = await resp.json();
        dataMap = {};
        maxVal  = 0;
        for (const item of items) {
          dataMap[`${item.x},${item.y}`] = item;
          const m = Math.max(item.sheet1, item.sheet2, item.sheet3, item.sheet4);
          if (m > maxVal) maxVal = m;
        }
        if (maxVal === 0) maxVal = 1;
        document.getElementById('status').textContent =
          `${items.length}개 항목 | 최대 실패: ${maxVal.toLocaleString()}`;
        render();
      } catch (e) {
        document.getElementById('status').textContent = '오류: ' + e.message;
      }
    }

    // ── auto-refresh ─────────────────────────────────────────────────────────────
    function toggleAuto() {
      if (document.getElementById('autoRefresh').checked) {
        autoId = setInterval(loadData, 5000);
      } else {
        clearInterval(autoId);
        autoId = null;
      }
    }

    // ── tooltip ──────────────────────────────────────────────────────────────────
    const canvas  = document.getElementById('grid');
    const tooltip = document.getElementById('tooltip');

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx   = (e.clientX - rect.left) * (canvas.width  / rect.width);
      const my   = (e.clientY - rect.top)  * (canvas.height / rect.height);
      const gx   = Math.floor((mx - PAD_L) / CELL) + 1;
      const gy   = GRID - Math.floor((my - PAD_T) / CELL);
      if (gx < 1 || gx > GRID || gy < 1 || gy > GRID) {
        tooltip.style.display = 'none'; return;
      }
      const item = dataMap[`${gx},${gy}`];
      if (!item) { tooltip.style.display = 'none'; return; }
      const total = item.sheet1 + item.sheet2 + item.sheet3 + item.sheet4;
      tooltip.textContent =
        `위치 (${gx}, ${gy})\n` +
        `TL sheet1 : ${item.sheet1.toLocaleString()}\n` +
        `TR sheet2 : ${item.sheet2.toLocaleString()}\n` +
        `BL sheet3 : ${item.sheet3.toLocaleString()}\n` +
        `BR sheet4 : ${item.sheet4.toLocaleString()}\n` +
        `합계      : ${total.toLocaleString()}`;
      tooltip.style.left    = (e.clientX - rect.left + 14) + 'px';
      tooltip.style.top     = (e.clientY - rect.top  + 14) + 'px';
      tooltip.style.display = 'block';
    });
    canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

    // ═══════════════════════════════════════════════════════════════════════════
    // DEMO DATA — wafer-map failure patterns
    //
    // Design rules (applied to every pattern):
    //   1. base(x,y)   strong spatial signal, 70-80 % weight
    //   2. δ1…δ4       per-sheet modulation, max ±DMAX
    //   3. withFloor() guarantees every sheet ≥ FLOOR so no cell is blank-white
    //
    // FLOOR means "cold" cells still show as a soft mid-blue (not near-white).
    // Combined with the gamma correction in getColor(), the full blue→red range
    // is used even for patterns that only span part of [0,1].
    // ═══════════════════════════════════════════════════════════════════════════

    // ── shared helpers ───────────────────────────────────────────────────────────
    function gauss(x, y, px, py, sigma) {
      return Math.exp(-((x - px) ** 2 + (y - py) ** 2) / (2 * sigma * sigma));
    }
    function ringVal(x, y, targetR, sigma) {
      const r = Math.sqrt((x - CX) ** 2 + (y - CY) ** 2);
      return Math.exp(-((r - targetR) ** 2) / (2 * sigma * sigma));
    }
    function edgeFrac(x, y) {
      return Math.sqrt((x - CX) ** 2 + (y - CY) ** 2) / R;
    }
    function clamp(v) { return Math.min(Math.max(v, 0), 1); }

    // No FLOOR — background cells are genuinely ~0 (white).
    // Narrow Gaussians (σ=5-6) give steep peaks with white surroundings.
    const DMAX = 0.13;

    // ── Pattern 0: twin hot-spots (σ=6, wide white background) ──────────────────
    // Cells > ~12 px from either peak fall below the blue threshold → white.
    function patternClassic(x, y) {
      const g1   = gauss(x, y, 13, 38, 6);
      const g2   = gauss(x, y, 38, 38, 6);
      const halo = ringVal(x, y, 17, 2.5) * 0.28;
      const base = clamp(g1 * 0.72 + g2 * 0.65 + halo);
      return [
        clamp(base + gauss(x,y,12,39,4)*0.13 - gauss(x,y,39,39,4)*0.05),
        clamp(base - gauss(x,y,13,38,4)*0.05 + gauss(x,y,39,39,4)*0.13),
        clamp(base + ringVal(x,y,16,2)*0.10  - gauss(x,y,26,26,5)*0.08),
        clamp(base + gauss(x,y,12,39,3)*0.07 + gauss(x,y,39,39,3)*0.07),
      ];
    }

    // ── Pattern 1: diagonal scratches (σ=1.8, thin sharp lines) ─────────────────
    // Cells even 4 px off either line are white.
    function patternScratch(x, y) {
      const sig = 1.8;
      const d1  = Math.exp(-((y - x)        ** 2) / (2 * sig * sig));
      const d2  = Math.exp(-((y - (51 - x)) ** 2) / (2 * sig * sig));
      const base = clamp(Math.max(d1, d2) * 0.88);
      return [
        clamp(base + (d1 - d2) * DMAX),
        clamp(base + (d2 - d1) * DMAX),
        clamp(base + (d1 + d2 - 1) * DMAX),
        clamp(base - Math.abs(d1 - d2) * DMAX),
      ];
    }

    // ── Pattern 2: Gaussian bulls-eye (3 sharp rings, white gaps between) ────────
    // Each ring is a narrow Gaussian (σ=2) at r=5, 12, 19.
    function patternBullseye(x, y) {
      const r1 = ringVal(x, y,  5, 2.0);
      const r2 = ringVal(x, y, 12, 2.0);
      const r3 = ringVal(x, y, 19, 2.0);
      return [
        clamp(r1*0.90 + r2*0.75 + r3*0.80),
        clamp(r1*0.80 + r2*0.90 + r3*0.75),
        clamp(r1*0.75 + r2*0.80 + r3*0.90),
        clamp(r1*0.88 + r2*0.88 + r3*0.88),
      ];
    }

    // ── Pattern 3: steep top-edge gradient ───────────────────────────────────────
    // Lower half of wafer is white (ramp = 0 for ny ≤ 0).
    // Power 2.5 concentrates colour in the top ~30% of the wafer height,
    // giving fewer visible bands than a gentler exponent.
    function patternGradient(x, y) {
      const nx  = (x - CX) / R;
      const ny  = (y - CY) / R;
      const vig = clamp(1 - edgeFrac(x,y) * 0.20);
      const ramp = clamp(Math.pow(Math.max(ny, 0), 2.5) * vig * 0.95);
      return [
        clamp(ramp + nx *  DMAX * vig),
        clamp(ramp - nx *  DMAX * vig),
        clamp(ramp + nx * DMAX * 0.5 * vig + ny * DMAX * 0.4 * vig),
        clamp(ramp - nx * DMAX * 0.5 * vig + ny * DMAX * 0.4 * vig),
      ];
    }

    // ── Pattern 4: rim sector defect (ef^4, cardinal arcs) ───────────────────────
    // ef^4 keeps interior white (r<70%→ ef<0.24 → ~white) and concentrates signal
    // at the outer ~25% of radius.  All 4 sheets share 85% of the dominant sector
    // signal so in-cell colour variation is subtle (≤ orange→red), not red vs blue.
    function patternSector(x, y) {
      const ef    = Math.pow(edgeFrac(x, y), 4.0);
      const angle = Math.atan2(y - CY, x - CX);
      // Sector strength at each cardinal direction (slightly wider than 90°)
      function s(peak) {
        const d = Math.abs(((angle - peak + 3 * Math.PI) % (2 * Math.PI)) - Math.PI);
        return Math.cos(Math.min(d / 1.15, Math.PI / 2)) ** 2 * ef;
      }
      const s0 = s(0), s1 = s(Math.PI / 2), s2 = s(Math.PI), s3 = s(-Math.PI / 2);
      const peak = Math.max(s0, s1, s2, s3);  // dominant sector at this angle
      const base = peak * 0.85;               // 85% shared → minimal in-cell jump
      return [
        clamp(base + s0 * 0.15),  // sheet1: slight right-sector emphasis
        clamp(base + s1 * 0.15),  // sheet2: slight top-sector emphasis
        clamp(base + s2 * 0.15),  // sheet3: slight left-sector emphasis
        clamp(base + s3 * 0.15),  // sheet4: slight bottom-sector emphasis
      ];
    }

    // ── Pattern 5: scattered micro-clusters (σ=4) ────────────────────────────────
    // All sheets share the same cluster set; inter-cluster cells are white.
    function patternClusters(x, y) {
      const ALL = [[10,40],[28,44],[42,38],[35,14],[6,22],[44,20],[18,10],[22,28]];
      const base = clamp(ALL.reduce((s, [px,py]) =>
        s + gauss(x, y, px, py, 4.0) * 0.55, 0));
      const accent = ([px1,py1], [px2,py2]) =>
        gauss(x,y,px1,py1,2.5)*0.13 + gauss(x,y,px2,py2,2.5)*0.10;
      return [
        clamp(base + accent(ALL[0], ALL[4])),
        clamp(base + accent(ALL[1], ALL[3])),
        clamp(base + accent(ALL[2], ALL[5])),
        clamp(base + accent(ALL[6], ALL[7])),
      ];
    }

    // ── Pattern 6: centre disk + thin edge ring ───────────────────────────────────
    // Two isolated hot zones; the band between them is white.
    function patternEdgeCenter(x, y) {
      const rr    = Math.sqrt((x - CX) ** 2 + (y - CY) ** 2);
      const inner = Math.exp(-(rr ** 2) / (2 * 5 * 5));
      const outer = ringVal(x, y, R * 0.84, 1.8);
      const base  = clamp(inner * 0.58 + outer * 0.58);
      const diff  = (inner - outer) * DMAX;
      return [
        clamp(base + diff),
        clamp(base - diff),
        clamp(base + diff * 0.50),
        clamp(base - diff * 0.50),
      ];
    }

    // ── pattern registry ─────────────────────────────────────────────────────────
    const PATTERNS = [
      { name: '트윈 핫스팟 (σ=6, wide white bg)',      fn: patternClassic    },
      { name: '대각선 스크래치 (σ=1.8, thin lines)',   fn: patternScratch    },
      { name: '동심원 불스아이 (Gaussian rings σ=2)',   fn: patternBullseye   },
      { name: '상단 그래디언트 (power 2.5, top 30%)',   fn: patternGradient   },
      { name: '방위각 섹터 결함 (ef⁴, cardinal arcs)', fn: patternSector     },
      { name: '산발성 마이크로 클러스터 (σ=4)',         fn: patternClusters   },
      { name: '중심·엣지 분리 결함 (disk + thin ring)', fn: patternEdgeCenter },
    ];

    // ── generate & post demo data ────────────────────────────────────────────────
    async function generateDemo() {
      const btn = document.getElementById('demoBtn');
      btn.disabled = true;

      // pick a random pattern
      const idx  = Math.floor(Math.random() * PATTERNS.length);
      const pat  = PATTERNS[idx];
      document.getElementById('patternName').textContent = `[ ${pat.name} ]`;
      document.getElementById('status').textContent = '더미 데이터 생성 중...';

      const MAX   = 9_800_000;
      const items = [];

      for (let x = 1; x <= GRID; x++) {
        for (let y = 1; y <= GRID; y++) {
          if ((x - CX) ** 2 + (y - CY) ** 2 > R * R) continue;  // wafer mask
          const [s1, s2, s3, s4] = pat.fn(x, y);
          items.push({
            x, y,
            sheet1: Math.round(MAX * s1),
            sheet2: Math.round(MAX * s2),
            sheet3: Math.round(MAX * s3),
            sheet4: Math.round(MAX * s4),
          });
        }
      }

      try {
        const resp = await fetch('/api/data', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(items),
        });
        if (!resp.ok) throw new Error('서버 응답 오류 ' + resp.status);
        await loadData();
      } catch (e) {
        document.getElementById('status').textContent = '오류: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    // ── init ────────────────────────────────────────────────────────────────────
    loadData();
    autoId = setInterval(loadData, 5000);
  </script>
</body>
</html>
